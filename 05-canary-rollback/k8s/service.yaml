# Two Services so the ServiceMonitor selector (app in myapp-stable, myapp-canary) matches both.
apiVersion: v1
kind: Service
metadata:
  name: myapp-stable
  namespace: default
  labels:
    app: myapp-stable
spec:
  selector:
    app: myapp-stable
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-canary
  namespace: default
  labels:
    app: myapp-canary
spec:
  selector:
    app: myapp-canary
  ports:
    - name: http
      port: 8080
      targetPort: 8080
