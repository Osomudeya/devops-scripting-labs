apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-stable
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp-stable
  template:
    metadata:
      labels:
        app: myapp-stable
    spec:
      containers:
        - name: app
          image: myapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          env:
            - name: VERSION
              value: stable
            - name: INJECT_LATENCY
              value: "false"
